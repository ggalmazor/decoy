# Builds the static site and deploys it to GitHub Pages at decoy.ggalmazor.com.
#
# The trigger is a `v<version>` git tag rather than a push to main. The version in package.json is what the
# footer shows and what /version.json reports, and a deploy is verified by comparing the two, so a release
# is an explicit act (deploy/release.sh) rather than a side effect of merging. `workflow_dispatch` is the
# escape hatch for re-deploying an existing tag.
name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # The tag and package.json must agree. If they do not, the site would report a version the tag never
      # named, and every deploy verification against /version.json would fail with no obvious cause. The
      # declared version is also what the deploy job verifies against: a workflow_dispatch run has no tag,
      # only a ref name like "main".
      - name: Read the version and check it against the tag
        id: version
        run: |
          DECLARED="$(node -p "require('./package.json').version")"
          echo "version=${DECLARED}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$DECLARED" != "$TAG" ]; then
              echo "Tag says ${TAG} but package.json says ${DECLARED}." >&2
              exit 1
            fi
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # The github-pages environment that Pages creates only admits deployments from main. A tag has to be
  # allowed explicitly (a "v*" tag rule on the environment), or this job fails before its first step with
  # no log at all. deploy/release.sh checks that rule before it tags.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the live version
        env:
          EXPECTED: ${{ needs.build.outputs.version }}
        run: |
          for attempt in $(seq 1 20); do
            LIVE="$(curl -fsS --max-time 10 "https://decoy.ggalmazor.com/version.json?nocache=${attempt}" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || true)"
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "decoy.ggalmazor.com reports ${LIVE}"
              exit 0
            fi
            echo "live says '${LIVE:-nothing}', expected ${EXPECTED}; waiting"
            sleep 15
          done
          echo "The site never reported ${EXPECTED}. The Pages deploy may still be propagating, or DNS is not pointed yet." >&2
          exit 1

  # The CLI shares the site's version, so it is published by the same tag once the site is verified live.
  # Trusted publishing (OIDC) needs npm 11.5 or later and a publisher configured on npmjs.com; the job is
  # off until the repository variable NPM_PUBLISH is set, so a fresh fork does not fail here.
  publish:
    needs: deploy
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm publish --provenance --access public
